name: macOS build and tests
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-download:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/verify-download.sh 1.5.2
  build-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/compile-appicon.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-app-icons
          path: Resources/CompiledIcons/
      - run: swift build
      - run: swift test
      - name: Verify app packaging
        run: SIGN_ID=- scripts/package.sh
      - run: codesign --verify --deep --strict dist/Reclaim.app
